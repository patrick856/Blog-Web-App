<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    :root {
      --red: #E72F24;
      --white: #F0F1EC;
      --black: #232629;
      --blue: #004592;
      --yellow: #F9D01E;
      --gap-color: #000;
    }


    .grid-container {
      display: grid;
      gap: 9px;
      grid-template: 414px 130px 155px 20px / 320px 198px 153px 50px;
      background-color: var(--gap-color);
      width: 748px;
      height: 748px;
    }

    .red {
      background-color: var(--red);
    }

    .blue {
      background-color: var(--blue);
      border-bottom: 10px solid var(--gap-color);
    }

    .black {
      background-color: var(--black);
    }

    .yellow {
      background-color: var(--yellow);
    }

    .white {
      background-color: var(--white);
    }

    .cell1 {
      grid-column: span 3;
    }

    .cell2 {
      grid-row: span 2;
    }

    .cell3 {
      grid-area: span 2 / span 2;
    }

    .cell4 {
      grid-row: span 2;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="grid-container">
    <div class="red cell"></div>
    <div class="white cell1"></div>
    <div class="white cell2"></div>
    <div class="white cell3"></div>
    <div class="blue cell"></div>
    <div class="white cell4"></div>
    <div class="white cell5"></div>
    <div class="black cell"></div>
    <div class="yellow cell"></div>

  </div>
</body>

</html>
